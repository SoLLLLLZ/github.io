services:
  - type: web
    name: financial-news-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEWS_DATA_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false